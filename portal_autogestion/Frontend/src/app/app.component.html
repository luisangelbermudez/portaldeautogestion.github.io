<header class="encabezado" *ngIf="mostrarNav">
  <a routerLink="/" class="marca">Portal <span class="acento">Acegrasco</span></a>

  <nav *ngIf="authService.esAdministrador()">
    <a routerLink="/usuarios" class="enlace-nav">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
      <span>Usuarios</span>
    </a>
    <a routerLink="/empleados" class="enlace-nav">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      <span>Empleados</span>
    </a>
    <a routerLink="/solicitudes" class="enlace-nav">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg>
      <span>Solicitudes</span>
    </a>
    <a routerLink="/certificados" class="enlace-nav">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="5"/><path d="M8.5 12.5 7 22l5-3 5 3-1.5-9.5"/></svg>
      <span>Certificados</span>
    </a>
    <a (click)="cerrarSesion()" class="enlace-nav salir">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      <span>Salir</span>
    </a>
  </nav>

  <nav *ngIf="!authService.esAdministrador()">
    <a (click)="cerrarSesion()" class="enlace-nav salir">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      <span>Cerrar sesión</span>
    </a>
  </nav>
</header>

<main>
  <router-outlet />
</main>

<footer class="pie" *ngIf="mostrarNav && authService.esAdministrador()">
  <div class="contacto">
    <span>Portal de Autogestión Acegrasco S.A. © 2026</span>
    <span>📞 (+57) 301 2952356</span>
    <span>✉️ info&#64;acegrasco.com.co</span>
    <span>📍 Calle 15 #5-23, Bogotá, Colombia</span>
  </div>
</footer>
